version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: corruptio
      POSTGRES_PASSWORD: corruptio_dev
      POSTGRES_DB: corruptio
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://corruptio:corruptio_dev@postgres:5432/corruptio
      JWT_SECRET: dev-jwt-secret-change-in-prod
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-prod
      PORT: '3001'
      CLIENT_URL: http://localhost:5173
      NODE_ENV: development
    depends_on:
      - postgres

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3001

volumes:
  pgdata:
